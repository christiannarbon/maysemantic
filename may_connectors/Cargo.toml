[package]
name = "may_connectors"
version = "0.1.0"
edition = "2024"

[dependencies]
async-stream = "0.3.6"
async-trait = "0.1"
base64 = "0.22.1"
chrono = "0.4.44"
futures = "0.3"
gcp_auth = "0.12.6"
jsonwebtoken = "9.3"
may_secrets = { version = "0.1.0", path = "../may_secrets" }
pkcs8 = { version = "0.10", features = ["encryption", "pem"] }
reqwest = { version = "0.13.4", features = ["json"] }
rsa = { version = "0.9", features = ["pem"] }
rustls = { version = "0.23.40", features = ["ring"] }
rustls-native-certs = "0.8.4"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.10"
thiserror = "2.0"
tokio = { version = "1.0", features = ["sync", "rt", "net", "macros"] }
tokio-postgres = "0.7.17"
tokio-postgres-rustls = "0.14.0"
tracing = "0.1"
[lints]
workspace = true

[dev-dependencies]
rand = "0.8"
