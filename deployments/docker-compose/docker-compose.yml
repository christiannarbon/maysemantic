name: maysemantic

services:
  may-identity-db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${IDENTITY_DB_USER}
      POSTGRES_PASSWORD: ${IDENTITY_DB_PASSWORD}
      POSTGRES_DB: ${IDENTITY_DB_NAME}
    ports:
      - "5433:5432"
    volumes:
      - may-identity-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${IDENTITY_DB_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  may-identity-migrate:
    build:
      context: ../..
      dockerfile: deployments/helm/may/migrate.Dockerfile
    environment:
      DATABASE_URL: postgres://${IDENTITY_DB_USER}:${IDENTITY_DB_PASSWORD}@may-identity-db:5432/${IDENTITY_DB_NAME}
    depends_on:
      may-identity-db:
        condition: service_healthy

  may_pgwire:
    build:
      context: ../..
      dockerfile: may_pgwire/Dockerfile
    environment:
      IDENTITY_DB_URL: postgres://${IDENTITY_DB_USER}:${IDENTITY_DB_PASSWORD}@may-identity-db:5432/${IDENTITY_DB_NAME}
    ports:
      - "5432:5432"
    depends_on:
      may-identity-db:
        condition: service_healthy
      may-identity-migrate:
        condition: service_completed_successfully
      may-vault:
        condition: service_healthy

  may-vault:
    # HashiCorp Vault (alternative: quay.io/openbao/openbao:2.0)
    image: hashicorp/vault:1.17
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN_ID}
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    ports:
      - "8200:8200"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8200/v1/sys/health"]
      interval: 5s
      timeout: 5s
      retries: 5

  may-vault-seed:
    image: hashicorp/vault:1.17
    depends_on:
      may-vault:
        condition: service_healthy
    environment:
      VAULT_ADDR: http://may-vault:8200
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN_ID}
    volumes:
      - ./scripts/vault-seed.sh:/vault-seed.sh
    entrypoint: ["/bin/sh", "/vault-seed.sh"]

volumes:
  may-identity-data:
