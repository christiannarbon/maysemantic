{{- if .Values.vault.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: may-vault
  labels:
    app: may-vault
spec:
  replicas: 1
  selector:
    matchLabels:
      app: may-vault
  template:
    metadata:
      labels:
        app: may-vault
    spec:
      volumes:
        - name: vault-config
          emptyDir: {}
        - name: vault-data
          persistentVolumeClaim:
            claimName: may-vault-data
      initContainers:
        - name: vault-config-init
          image: busybox
          command:
            - sh
            - -c
            - |
              cat <<EOF > /vault/config/config.json
              {
                "storage": {
                  "file": {
                    "path": "/vault/data"
                  }
                },
                "listener": {
                  "tcp": {
                    "address": "0.0.0.0:8200",
                    "tls_disable": 1
                  }
                },
                "ui": true
              }
              EOF
          volumeMounts:
            - name: vault-config
              mountPath: /vault/config
      containers:
        - name: vault
          image: {{ .Values.vault.image }}
          args:
            - server
            - -config=/vault/config/config.json
          ports:
            - containerPort: 8200
              name: vault
          env:
            - name: VAULT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.vault.rootTokenSecret }}
                  key: token
                  optional: true
          volumeMounts:
            - name: vault-config
              mountPath: /vault/config
            - name: vault-data
              mountPath: /vault/data
          readinessProbe:
            httpGet:
              path: /v1/sys/health
              port: 8200
            initialDelaySeconds: 5
            periodSeconds: 5
{{- end }}
