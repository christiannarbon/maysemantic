{{- if .Values.identityDb.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-identity-db
  labels:
    app: {{ .Release.Name }}-identity-db
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
      name: postgres
  selector:
    app: {{ .Release.Name }}-identity-db
{{- end }}
