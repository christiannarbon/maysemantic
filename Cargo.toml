[package]
name = "maysemantic"
version = "0.1.0"
edition = "2021"

[workspace]
members = [".", "cli", "pgwire"]

[workspace.dependencies]
tokio = { version = "1.52.3", features = ["full"] }
futures = "0.3.32"
anyhow = "1.0.102"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_norway = "0.9"
validator = { version = "0.20", features = ["derive"] }
schemars = "1"
thiserror = "2"
regex = "1.10"
serde_json = "1.0"
once_cell = "1.21.4"
tokio = { workspace = true }
futures = { workspace = true }
anyhow = { workspace = true }
petgraph = "0.8.3"

[dev-dependencies]
tempfile = "3.27.0"
