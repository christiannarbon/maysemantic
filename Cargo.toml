[workspace]
members = ["may_core", "may_cli", "may_pgwire", "may_auth", "may_rest", "may_secrets", "may_connectors"]
resolver = "2"

[workspace.dependencies]
tokio = { version = "1.52.3", features = ["full"] }
futures = "0.3.32"
anyhow = "1.0.102"

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
pedantic = "warn"
allow_attributes_without_reason = "warn"
