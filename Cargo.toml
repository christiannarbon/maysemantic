[package]
name = "maysemantic"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
validator = { version = "0.18", features = ["derive"] }
schemars = "0.8"
thiserror = "1.0"
lazy_static = "1.4"
regex = "1.10"
serde_json = "1.0"
once_cell = "1.21.4"
tokio = { version = "1.52.3", features = ["full"] }
futures = "0.3.32"
anyhow = "1.0.102"

[workspace]
members = [
    ".",
    "cli"
]

[dev-dependencies]
tempfile = "3.27.0"
