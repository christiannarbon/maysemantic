[package]
name = "may_pgwire"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { workspace = true }
anyhow = { workspace = true }
tracing = "0.1"
tracing-subscriber = "0.3"
pgwire = "0.27"
async-trait = "0.1"
may_core = { path = "../may_core" }
futures = { workspace = true }
sqlparser = "0.62.0"
may_auth = { path = "../may_auth" }
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio-rustls", "uuid", "chrono"] }
uuid = "1.23.1"
may_connectors = { path = "../may_connectors" }
may_secrets = { path = "../may_secrets" }
serde_json = "1.0"
[dev-dependencies]
tokio-postgres = "0.7"
uuid = { version = "1.23.1", features = ["v4"] }

[[test]]
name = "integration"
path = "tests/integration/main.rs"
