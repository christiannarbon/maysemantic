name: CI

on:
  push:
    branches:
      - main
      - "feature/*"
      - "hotfix/*"
      - "release/*"
  pull_request:
    branches:
      - main

env:
  CARGO_TERM_COLOR: always
  NODE_OPTIONS: "--no-deprecation"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  SQLX_OFFLINE: "true"

permissions:
  contents: read
  actions: write

jobs:
  build:
    name: Format, Lint, and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2.9.1

      - name: Check Formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run Unit Tests
        run: cargo test --workspace --test unit

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: may_pgwire/Dockerfile

      - name: Pre-pull buildkit image to avoid timeout
        run: |
          for i in {1..5}; do
            docker pull moby/buildkit:buildx-stable-1 && break || sleep 15
          done

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image (Verify Only)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: may_pgwire/Dockerfile
          push: false
          load: true
          tags: may_pgwire:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start PGWire Service Container
        run: |
          docker run -d --name pgwire-test -p 5432:5432 \
            -v ${{ github.workspace }}/demos/valid_demo:/app:ro \
            may_pgwire:test

      - name: Verify Query Execution & Model Loading
        run: |
          # Install pg_isready/psql on ubuntu runner
          sudo apt-get update && sudo apt-get install -y postgresql-client

          # Wait up to 30 seconds for the service to accept connections
          READY=0
          for i in {1..30}; do
            if pg_isready -h 127.0.0.1 -p 5432 -q; then
              echo "PGWire container is ready!"
              READY=1
              break
            fi
            echo "Waiting for container boot... ($i/30)"
            sleep 1
          done

          if [ "$READY" -eq 0 ]; then
            echo "Container did not become ready in time."
            docker logs pgwire-test
            exit 1
          fi

          # Smoke-test the wire protocol with SELECT 1 (no auth DB required)
          RESULT=$(PGPASSWORD='' psql -h 127.0.0.1 -p 5432 -U postgres -d postgres \
            --no-password -c 'SELECT 1;' -t 2>&1 || true)
          # Strip whitespace from RESULT
          RESULT=$(echo "$RESULT" | xargs)
          echo "Query Result: '$RESULT'"
          
          if [ -z "$RESULT" ]; then
            echo "Verification failed: Expected RESULT to be non-empty"
            exit 1
          fi

          # Verify that the semantic model was loaded successfully from demos/valid_demo
          if docker logs pgwire-test 2>&1 | grep -q "Successfully loaded 1 models"; then
            echo "Model loading verified!"
          else
            echo "Verification failed: expected 1 loaded model in logs"
            docker logs pgwire-test
            exit 1
          fi

      - name: Clean up test container
        if: always()
        run: docker rm -f pgwire-test || true

  helm:
    name: Helm Lint and Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.2

      - name: Install Helm
        uses: azure/setup-helm@v4.2.0
        with:
          version: 'latest'

      - name: Helm Lint
        run: helm lint --strict deployments/helm/may --set identityDb.password=dummy

      - name: Helm Template
        run: helm template deployments/helm/may --set identityDb.password=dummy

  integration-test:
    name: Pagila Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2.9.1

      - name: Start Pagila Database
        run: docker compose up -d --wait
        working-directory: may_core/tests/integration/env

      - name: Run Pagila Integration Tests
        run: cargo test --workspace --test integration
        env:
          PAGILA_TESTS: "1"

      - name: Stop Pagila Database
        if: always()
        run: docker compose down -v
        working-directory: may_core/tests/integration/env

  cache-cleanup:
    name: Automated Cache Cleanup
    runs-on: ubuntu-latest
    needs: [build, integration-test, helm]
    if: always()
    steps:
      - name: Cleanup old caches
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const ref = context.ref;
            console.log(`Cleaning up caches for ref: ${ref}`);
            
            const caches = await github.rest.actions.getActionsCacheList({
              owner,
              repo,
              ref,
              sort: 'created_at',
              direction: 'desc'
            });
            
            // Keep the 2 most recent caches (from the build and integration-test jobs)
            const toDelete = caches.data.actions_caches.slice(2);
            if (toDelete.length === 0) {
              console.log("No old caches to delete.");
              return;
            }
            
            for (const cache of toDelete) {
              console.log(`Deleting cache ${cache.key} (created at ${cache.created_at})`);
              try {
                await github.rest.actions.deleteActionsCacheById({
                  owner,
                  repo,
                  cache_id: cache.id,
                });
              } catch (e) {
                console.log(`Failed to delete cache ${cache.key}: ${e.message}`);
              }
            }
